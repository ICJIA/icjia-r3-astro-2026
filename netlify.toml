[build]
# Configure mise to recognize .nvmrc files before running the build
command = "mise settings add idiomatic_version_file_enable_tools node && yarn generate"
publish = "dist"

[build.environment]
# Ensure mise is available in the build environment
NODE_VERSION = "20.19.0"

[[headers]]
for = "/*"
[headers.values]
## X-Frame-Options = "SAMEORIGIN"
## X-XSS-Protection = "1; mode=block"
##  Referrer-Policy = "no-referrer"
##  X-Content-Type-Options = "nosniff"
Access-Control-Allow-Origin = "*"
X-Greeting = "Hello from Chicago!"
