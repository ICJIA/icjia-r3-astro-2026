[build]
  base = "astro"
  # Local dev and CI both use pnpm (v1.0.3, 2026-05-24). pnpm version is
  # pinned via the `packageManager` field in astro/package.json so Corepack
  # uses the same binary locally and on Netlify. PNPM_VERSION is set as a
  # fallback for Netlify's auto-detection path.
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22.22.2"
  PNPM_VERSION = "10.33.0"
  MISE_DISABLE = "1"
  PUPPETEER_SKIP_DOWNLOAD = "1"
  PUPPETEER_SKIP_CHROMIUM_DOWNLOAD = "1"
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD = "1"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # CSP tightened 2026-05-24 (v1.0.2): dropped unused Google Fonts origins
    # from style-src and font-src (fonts have been self-hosted via @fontsource
    # since v0.10.0), and dropped cdn.jsdelivr.net + siteimproveanalytics.com
    # from script-src (legacy Nuxt-era entries, verified zero references in
    # astro/src/). frame-src keeps the ArcGIS hosts because Strapi body
    # content embeds StoryMaps via iframe.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.icjia.cloud; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: https://r3.icjia-api.cloud; font-src 'self' data:; connect-src 'self' https://r3.icjia-api.cloud https://researchhub.icjia-api.cloud https://mail.icjia.cloud https://plausible.icjia.cloud; frame-src 'self' https://storymaps.arcgis.com https://arcgis.com https://*.arcgis.com"

# Astro hashes asset filenames in /_astro/ so they can be cached forever.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# /searchIndex.json refreshes on every build; revalidate on each request.
[[headers]]
  for = "/searchIndex.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[images]
  remote_images = ["https://r3\\.icjia-api\\.cloud/.*", "https://researchhub\\.icjia-api\\.cloud/.*"]
