[build]
# Use yarn generate directly - let Netlify handle Node version
command = "yarn generate"
publish = "dist"

[build.environment]
# Set Node version explicitly for Netlify
NODE_VERSION = "20.19.0"
# Disable mise to prevent Python installation
MISE_DISABLE = "1"

[[headers]]
for = "/*"
[headers.values]
## X-Frame-Options = "SAMEORIGIN"
## X-XSS-Protection = "1; mode=block"
##  Referrer-Policy = "no-referrer"
##  X-Content-Type-Options = "nosniff"
Access-Control-Allow-Origin = "*"
X-Greeting = "Hello from Chicago!"
